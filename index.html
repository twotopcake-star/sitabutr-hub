<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Sitabutr Babrung School | Central Portal</title>
  
  <!-- Viewport & Mobile Standalone -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0284c7">
  
  <!-- Apple iOS Standalone -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sitabutr">
  <link rel="apple-touch-icon" href="https://i.postimg.cc/PqLhF2Mt/tra-rr.png">
  
  <!-- Favicon & PWA Manifest -->
  <link rel="icon" type="image/png" href="https://i.postimg.cc/PqLhF2Mt/tra-rr.png">
  <link rel="manifest" href="./manifest.json">
  
  <!-- Google Fonts & FontAwesome -->
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f4f7fb;
      font-family: 'Prompt', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* Iframe Shell */
    #app-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Loading Splash */
    #splash-screen {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.4s ease, visibility 0.4s;
    }

    #splash-screen.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .splash-logo {
      width: 90px;
      height: 90px;
      object-fit: contain;
      filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.12));
      animation: pulse 2s infinite ease-in-out;
    }

    .splash-title {
      margin-top: 18px;
      font-size: 1.15rem;
      font-weight: 600;
      color: #0f172a;
    }

    .splash-sub {
      font-size: 0.85rem;
      color: #64748b;
      margin-top: 4px;
    }

    .spinner {
      margin-top: 24px;
      width: 32px;
      height: 32px;
      border: 3px solid rgba(2, 132, 199, 0.2);
      border-top-color: #0284c7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    /* Floating Install Banner (Android) */
    #install-banner {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(120px);
      width: calc(100% - 32px);
      max-width: 420px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 20px;
      padding: 14px 18px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.15);
      display: flex;
      align-items: center;
      gap: 14px;
      z-index: 10000;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #install-banner.show {
      transform: translateX(-50%) translateY(0);
    }

    .install-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      object-fit: contain;
      background: #f8fafc;
      padding: 4px;
    }

    .install-info {
      flex: 1;
    }

    .install-info h4 {
      font-size: 0.95rem;
      font-weight: 600;
      color: #0f172a;
    }

    .install-info p {
      font-size: 0.75rem;
      color: #64748b;
    }

    .install-btn {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
      font-family: inherit;
    }

    .close-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 4px;
    }

    /* iOS Guide Prompt */
    #ios-prompt {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 420px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 16px 20px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.15);
      z-index: 10000;
      display: none;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    #ios-prompt.show {
      display: block;
      animation: slideUp 0.4s ease;
    }

    @keyframes slideUp {
      from { transform: translateX(-50%) translateY(50px); opacity: 0; }
      to { transform: translateX(-50%) translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Loading Splash Screen -->
  <div id="splash-screen">
    <img src="https://i.postimg.cc/PqLhF2Mt/tra-rr.png" alt="Logo" class="splash-logo">
    <div class="splash-title">Sitabutr Babrung School</div>
    <div class="splash-sub">กำลังเปิดระบบงานดิจิทัล...</div>
    <div class="spinner"></div>
  </div>

  <!-- Google Apps Script Embedded Iframe -->
  <iframe 
    id="app-frame" 
    src="https://script.google.com/macros/s/AKfycbxHz_PIhi2YqkZ9ZvmEyIdF9vmbhfvUO46p2GJJK-kfoqVEfdCtMSx8mLnCydLaGcj92g/exec"
    allow="geolocation; microphone; camera; midi; vr; accelerometer; gyroscope; payment; ambient-light-sensor"
    onload="hideSplash()"
  ></iframe>

  <!-- Android Native Install Banner -->
  <div id="install-banner">
    <img src="https://i.postimg.cc/PqLhF2Mt/tra-rr.png" alt="App Icon" class="install-icon">
    <div class="install-info">
      <h4>ติดตั้งแอป Sitabutr</h4>
      <p>เพิ่มลงหน้าจอมือถือเพื่อใช้งานสะดวกขึ้น</p>
    </div>
    <button class="install-btn" id="btn-install">ติดตั้ง</button>
    <button class="close-btn" onclick="dismissBanner()"><i class="fas fa-times"></i></button>
  </div>

  <!-- iOS Add to Home Instruction -->
  <div id="ios-prompt">
    <div style="font-weight: 600; font-size: 0.95rem; margin-bottom: 6px;">📲 ติดตั้งแอปบน iPhone / iPad</div>
    <p style="font-size: 0.8rem; color: #64748b; line-height: 1.4;">
      แตะปุ่มแชร์ <i class="fa-solid fa-arrow-up-from-bracket" style="color:#0284c7;"></i> ด้านล่าง แล้วเลือก <b>"เพิ่มไปยังหน้าจอโฮม (Add to Home Screen)"</b>
    </p>
    <button onclick="document.getElementById('ios-prompt').classList.remove('show')" style="margin-top: 10px; background:#f1f5f9; border:none; padding:5px 14px; border-radius:8px; font-size:0.75rem; color:#475569; cursor:pointer;">รับทราบ</button>
  </div>

  <script>
    // ซ่อนหน้า Splash เมื่อ Iframe โหลดเสร็จ
    function hideSplash() {
      setTimeout(() => {
        document.getElementById('splash-screen').classList.add('hidden');
      }, 600);
    }

    // ลงทะเบียน Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('Service Worker Registered:', reg.scope))
          .catch((err) => console.error('Service Worker Error:', err));
      });
    }

    // จัดการ Event ติดตั้งแอป (Android Chrome)
    let deferredPrompt;
    const installBanner = document.getElementById('install-banner');
    const btnInstall = document.getElementById('btn-install');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      setTimeout(() => {
        installBanner.classList.add('show');
      }, 1500);
    });

    btnInstall.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        console.log(`User response to the install prompt: ${outcome}`);
        deferredPrompt = null;
        installBanner.classList.remove('show');
      }
    });

    function dismissBanner() {
      installBanner.classList.remove('show');
    }

    // ตรวจสอบอุปกรณ์ iOS เพื่อแนะนำการติดตั้ง
    const isIos = () => {
      const userAgent = window.navigator.userAgent.toLowerCase();
      return /iphone|ipad|ipod/.test(userAgent);
    };
    const isInStandaloneMode = () => ('standalone' in window.navigator) && (window.navigator.standalone);

    if (isIos() && !isInStandaloneMode()) {
      setTimeout(() => {
        document.getElementById('ios-prompt').classList.add('show');
      }, 2500);
    }
  </script>
</body>
</html>
